name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build CloudStream plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace make makePluginsJson

          test -s build/plugins.json || {
            echo "::error::Gradle did not generate build/plugins.json."
            exit 1
          }

          publish_dir="$RUNNER_TEMP/cloudstream-publish"
          mkdir -p "$publish_dir"

          while IFS= read -r -d '' artifact; do
            cp "$artifact" "$publish_dir/"
          done 1)

          if ! find "$publish_dir" -maxdepth 1 -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "::error::Gradle did not produce any .cs3 plugin files."
            exit 1
          fi

          cp build/plugins.json "$publish_dir/plugins.json"
          test -s "$publish_dir/plugins.json"

      - name: Publish builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan cloudstream-publish
          git clean -fdx
          cp -a "$RUNNER_TEMP/cloudstream-publish/." .
          git add -A

          if git diff --cached --quiet; then
            echo "No published files changed."
            exit 0
          fi

          git commit -m "Build $GITHUB_SHA"
          git push --force origin HEAD:builds
