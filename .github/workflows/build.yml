name: Build

on:
  push:
    branches: [master, main]
    # Documentation-only edits should not republish identical provider binaries.
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel a build while it is creating/publishing the builds branch.
# GitHub will keep the newest pending run, which publishes the latest master/main commit.
concurrency:
  group: cloudstream-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build CloudStream plugins
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          build_success=0
          for attempt in 1 2 3; do
            echo "::group::Gradle build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace make makePluginsJson; then
              build_success=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Gradle build failed on attempt $attempt/3; retrying in case this was a transient dependency/network issue."
              ./gradlew --stop || true
              sleep $((attempt * 10))
            fi
          done
          if [ "$build_success" -ne 1 ]; then
            echo "::error::CloudStream plugin build failed after three attempts."
            exit 1
          fi
          test -s build/plugins.json
          publish_dir="$RUNNER_TEMP/cloudstream-publish"
          mkdir -p "$publish_dir"
          find . -type f -path '*/build/*.cs3' -exec cp {} "$publish_dir/" \;
          if ! find "$publish_dir" -maxdepth 1 -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "::error::Gradle did not produce any .cs3 plugin files."
            exit 1
          fi
          cp build/plugins.json "$publish_dir/plugins.json"
          test -s "$publish_dir/plugins.json"

          # Validate the index and every referenced plugin before publishing.
          # This prevents a partial/stale plugins.json from replacing the live builds branch.
          python3 - "$publish_dir" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          from urllib.parse import urlparse

          publish_dir = pathlib.Path(sys.argv[1])
          plugins_path = publish_dir / "plugins.json"
          try:
              plugins = json.loads(plugins_path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"::error::plugins.json is invalid JSON: {exc}")

          if not isinstance(plugins, list) or not plugins:
              raise SystemExit("::error::plugins.json must contain a non-empty plugin list.")

          seen = set()
          referenced_files = set()
          for plugin in plugins:
              if not isinstance(plugin, dict):
                  raise SystemExit("::error::plugins.json contains a non-object entry.")

              internal_name = plugin.get("internalName") or plugin.get("name")
              url = plugin.get("url")
              version = plugin.get("version")
              if not internal_name or not isinstance(url, str) or not url.strip():
                  raise SystemExit(f"::error::Plugin entry is missing internalName/name or url: {plugin!r}")
              if internal_name in seen:
                  raise SystemExit(f"::error::Duplicate plugin internalName: {internal_name}")
              seen.add(internal_name)

              if not isinstance(version, int) or version < 1:
                  raise SystemExit(f"::error::Invalid plugin version for {internal_name}: {version!r}")

              filename = pathlib.PurePosixPath(urlparse(url).path).name
              if not filename.endswith(".cs3"):
                  raise SystemExit(f"::error::Plugin URL does not end in .cs3 for {internal_name}: {url}")
              artifact = publish_dir / filename
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise SystemExit(f"::error::Missing or empty artifact referenced by {internal_name}: {filename}")
              referenced_files.add(filename)

              expected_size = plugin.get("fileSize")
              if isinstance(expected_size, int) and expected_size != artifact.stat().st_size:
                  raise SystemExit(
                      f"::error::File size mismatch for {filename}: manifest={expected_size}, actual={artifact.stat().st_size}"
                  )

              expected_hash = plugin.get("fileHash")
              if isinstance(expected_hash, str) and expected_hash.startswith("sha256-"):
                  actual_hash = "sha256-" + hashlib.sha256(artifact.read_bytes()).hexdigest()
                  if actual_hash != expected_hash:
                      raise SystemExit(f"::error::SHA-256 mismatch for {filename}: manifest hash is stale")

          artifact_files = {p.name for p in publish_dir.glob("*.cs3") if p.is_file()}
          unindexed = artifact_files - referenced_files
          if unindexed:
              raise SystemExit(f"::error::Built plugins are missing from plugins.json: {', '.join(sorted(unindexed))}")

          print(f"Validated {len(plugins)} plugin entries and {len(artifact_files)} .cs3 artifacts.")
          PY

      - name: Publish builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan cloudstream-publish
          git clean -fdx
          cp -a "$RUNNER_TEMP/cloudstream-publish/." .
          git add -A
          git commit -m "Build $GITHUB_SHA"
          git push --force origin HEAD:builds
